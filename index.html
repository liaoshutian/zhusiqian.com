<!DOCTYPE HTML>
<html>

<head>
	<title>我们的爱情</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<style type="text/css">
		@font-face {
			font-family: digit;
			src: url('digital.ttf') format("truetype");
		}
	</style>
	<link href="css/default.css" type="text/css" rel="stylesheet">
	<script type="text/javascript" src="js/jquery.js"></script>
	<script type="text/javascript" src="js/garden.js"></script>
	<script type="text/javascript" src="js/functions.js"></script>
</head>

<body>
	<div id="mainDiv">
		<div id="content">
			<div id="code">
				<span class="comments">青玉案·元夕</span><br />

				<span class="comments"></span><br />
				<span class="comments">东风夜放花千树。</span><br />
				<span class="comments">更吹落、星如雨。</span><br />
				<span class="comments">宝马雕车香满路。</span><br />
				<span class="comments">凤箫声动，玉壶光转，</span><br />
				<span class="comments">一夜鱼龙舞。</span><br />

				<span class="comments"></span><br />
				<span class="comments">蛾儿雪柳黄金缕。</span><br />
				<span class="comments">笑语盈盈暗香去。</span><br />
				<span class="comments">众里寻他千百度。</span><br />
				<span class="comments">蓦然回首，那人却是，</span><br />
				<span class="comments">我的小宝贝。</span><br />
				<span class="comments"></span><br />
				<span class="comments">Rex</span><br />
			</div>
			<div id="loveHeart">
				<canvas id="garden"></canvas>
				<div id="words">
					<div id="messages">
						小宝贝，爱情的时钟从这一刻开始转动
						<div id="elapseClock"></div>
					</div>
					<div id="loveu">
						Love u forever and ever.<br />
						<div class="signature">- Rex</div>
					</div>
				</div>
			</div>
		</div>
		<div id="copyright">
			<a class="text-reset mx-auto" target="_blank" href="https://beian.miit.gov.cn">粤ICP备2023015973号</a>
		</div>
	</div>
	<script type="text/javascript">
		var offsetX = $("#loveHeart").width() / 2;
		var offsetY = $("#loveHeart").height() / 2 - 55;
		var together = new Date();
		// 此处月份介于 0 ~ 11 之间。用本地时间表示，如 8 月要用 7 表示。
		together.setFullYear(2014, 7, 30);
		together.setHours(12);
		together.setMinutes(0);
		together.setSeconds(0);
		together.setMilliseconds(0);

		if (!document.createElement('canvas').getContext) {
			var msg = document.createElement("div");
			msg.id = "errorMsg";
			msg.innerHTML = "Your browser doesn't support HTML5!<br/>Recommend use Chrome 14+/IE 9+/Firefox 7+/Safari 4+";
			document.body.appendChild(msg);
			$("#code").css("display", "none")
			$("#copyright").css("position", "absolute");
			$("#copyright").css("bottom", "10px");
			document.execCommand("stop");
		} else {
			setTimeout(function () {
				startHeartAnimation();
			}, 5000);

			timeElapse(together);
			setInterval(function () {
				timeElapse(together);
			}, 500);

			adjustCodePosition();
			$("#code").typewriter();
		}
	</script>
</body>

</html>
